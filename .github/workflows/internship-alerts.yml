name: Internship alerts

on:
  schedule:
    - cron: "17 12 * * *"   # every day at 12:17 UTC (8:17am Eastern during daylight time)
  workflow_dispatch:         # lets you run it any time from the Actions tab

permissions:
  contents: write   # commit the updated spreadsheet
  issues: write     # open an alert issue

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check organizations for internships
        id: tracker
        env:
          # All optional. Add them under Settings → Secrets and variables → Actions.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python tracker.py

      - name: Open an alert issue
        if: steps.tracker.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create internship-alert --color 2E7D32 --description "New internship / fellowship / chief of staff postings" 2>/dev/null || true
          gh issue create \
            --title "🔔 ${{ steps.tracker.outputs.new_count }} new posting(s) — $(date -u +%Y-%m-%d)" \
            --body-file data/new_postings.md \
            --label internship-alert \
            --assignee "${{ github.repository_owner }}" \
          || gh issue create \
            --title "🔔 ${{ steps.tracker.outputs.new_count }} new posting(s) — $(date -u +%Y-%m-%d)" \
            --body-file data/new_postings.md \
            --label internship-alert

      - name: Save the updated spreadsheet
        run: |
          git config user.name "internship-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update internship postings $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
